<div class="flex items-center justify-between flex-wrap gap-3 mb-4">
  <h2 class="text-2xl font-extrabold">🏆 <span class="grad-text">Ranking Gacha+</span></h2>
  <button class="btn-secondary px-4 py-2 rounded-lg text-sm" onclick="alert('✅ Ranking actualizado')">🔄 Actualizar</button>
</div>
<p class="text-sm mb-4" style="color:#A89CC8;">Puntaje 1–100 · Estilo FIFA / Spotify Charts · <strong>Inicia sesión para ver el puntaje completo 🔐</strong></p>

<div id="rankLocked" class="card rounded-xl p-8 text-center scale-in">
  <div class="text-5xl mb-4">🔒</div>
  <h3 class="text-xl font-bold mb-2">Ranking protegido</h3>
  <p class="mb-6" style="color:#A89CC8;">Inicia sesión o regístrate gratis para ver el puntaje completo de cada GachaTuber</p>
  <div class="flex gap-3 justify-center flex-wrap">
    <button class="btn-primary px-5 py-2 rounded-lg" onclick="openAuthModal()">🔑 Iniciar Sesión</button>
    <button class="btn-secondary px-5 py-2 rounded-lg" onclick="switchAuthTab('register');openAuthModal()">📝 Registrarse</button>
  </div>
</div>

<div id="rankUnlocked" class="hidden">
  <div class="flex gap-2 flex-wrap mb-5" id="rankTabs">
    <div class="rank-tab active" data-tab="tubers" onclick="cambiarRankTab(this)">Top GachaTubers</div>
    <div class="rank-tab" data-tab="videos" onclick="cambiarRankTab(this)">Top Videos</div>
  </div>
  <div id="rankList"></div>
</div>

<script>
(function(){
  if(!currentUser) return;
  document.getElementById('rankLocked').classList.add('hidden');
  document.getElementById('rankUnlocked').classList.remove('hidden');
  var TUBERS = [
    {name:"Jazmín_Studios♡",score:98.0,subs:"~200K",views:"1.53M"},
    {name:"Euni (Eunice_mha)",score:75.7,subs:"130K",views:"882K"},
    {name:"Emy! ᐛ ) 💕",score:69.7,subs:"869K",views:"633K"},
    {name:"Valeria Gtz",score:62.1,subs:"~80K",views:"654K"},
    {name:"Soy Tote",score:48.7,subs:"178K",views:"316K"},
    {name:"Gene Pop",score:40.7,subs:"217K",views:"159K"},
    {name:"YUNA_KI",score:28.4,subs:"4.5K",views:"27K"},
    {name:"Anyme Wolf",score:19.0,subs:"725",views:"60K"},
    {name:"Cristalis Diamonds",score:12.4,subs:"1.4K",views:"2K"},
    {name:"KaLeB",score:1.8,subs:"3.8K",views:"35K"},
    {name:"aBe",score:0.4,subs:"12.8K",views:"—"},
    {name:"GachaLife's World",score:0.1,subs:"259",views:"2K"}
  ];
  var VIDEOS = [
    {name:"Medio litro de té frío",author:"Euni",views:"397K",score:98},
    {name:"Hey mom | GL2",author:"Jazmín_Studios",views:"360K",score:89},
    {name:"🏃‍♀️ #gacha #animation",author:"Jazmín_Studios",views:"336K",score:83},
    {name:"Unstable Little Mermaid",author:"Jazmín_Studios",views:"328K",score:81},
    {name:"#jackstauber animation",author:"Jazmín_Studios",views:"328K",score:80},
    {name:"Uuf estas Barbies 😝",author:"Euni",views:"252K",score:62},
    {name:"Vitamina trend | Alight",author:"Emy!",views:"233K",score:57},
    {name:"El futuro de Japón",author:"Emy!",views:"210K",score:52},
    {name:"Isabella y Caleb…",author:"Valeria Gtz",views:"205K",score:50},
    {name:"Llamada🗣📱 #gacha",author:"Jazmín_Studios",views:"180K",score:44}
  ];
  var colors = ['#FBBF24','#C084FC','#F472B6'];
  function render(data){
    document.getElementById('rankList').innerHTML = data.map(function(r,i){
      var bg = i<3 ? colors[i] : '#241B3F';
      var tc = i<3 ? '#0F0A1A' : '#F3EFFF';
      return '<div class="rank-row scale-in" style="animation-delay:'+(i*40)+'ms;">'+
        '<div class="rank-num" style="background:'+bg+';color:'+tc+';">'+(i+1)+'</div>'+
        '<div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+r.name+'</div>'+
        '<div style="font-size:11px;color:#A89CC8;">'+(r.author?r.author+' · ':'')+(r.subs?r.subs+' suscriptores · ':'')+(r.views?r.views+' vistas':'')+'</div></div>'+
        '<div class="score-bar" style="max-width:140px;"><div class="score-fill" style="width:'+r.score+'%;"></div></div>'+
        '<div style="font-weight:800;font-size:18px;min-width:45px;text-align:right;" class="grad-text">'+r.score+'</div></div>';
    }).join('');
  }
  window.cambiarRankTab = function(el){
    document.querySelectorAll('#rankTabs .rank-tab').forEach(function(t){t.classList.remove('active');});
    el.classList.add('active');
    render(el.dataset.tab==='videos' ? VIDEOS : TUBERS);
  };
  render(TUBERS);
})();
</script>
