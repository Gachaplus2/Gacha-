<div class="flex items-center justify-between flex-wrap gap-3 mb-4">
  <h2 class="text-2xl font-extrabold">🏆 <span class="grad-gold">Ranking Oficial Gacha+</span></h2>
  <button id="refreshRankBtn" class="btn-secondary px-4 py-2 rounded-lg text-sm hidden" onclick="refreshRanking()">🔄 Actualizar ranking</button>
</div>
<p class="text-sm mb-4" style="color:var(--muted);">Puntaje 1–100 · Actualizado: <span id="rankDate">Hoy</span> · <strong>Inicia sesión para ver el puntaje completo 🔐</strong></p>

<div id="rankLocked" class="card rounded-xl p-8 text-center scale-in">
  <div class="text-5xl mb-4">🔒</div>
  <h3 class="text-xl font-bold mb-2">Ranking Oficial protegido</h3>
  <p class="mb-6" style="color:var(--muted);">Inicia sesión o regístrate gratis para ver el puntaje completo y las fotos de cada GachaTuber</p>
  <div class="flex gap-3 justify-center flex-wrap">
    <button class="btn-primary px-5 py-2 rounded-lg" onclick="openAuthModal()">🔑 Iniciar Sesión</button>
    <button class="btn-secondary px-5 py-2 rounded-lg" onclick="switchAuthTab('register');openAuthModal()">📝 Registrarse</button>
  </div>
</div>

<div id="rankUnlocked" class="hidden">
  <div class="flex gap-2 flex-wrap mb-5" id="rankTabs">
    <div class="rank-tab active" data-tab="tubers" onclick="cambiarRankTab(this)">Top GachaTubers</div>
    <div class="rank-tab" data-tab="videos" onclick="cambiarRankTab(this)">Top Videos</div>
  </div>
  <div id="rankList"></div>
</div>
