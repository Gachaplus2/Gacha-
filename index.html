.grad-text{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;transition:all .2s;border:none;cursor:pointer;}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 8px 20px rgba(168,85,247,.35);}
.btn-secondary{background:var(--surface);border:1px solid var(--border);color:var(--text);transition:all .2s;cursor:pointer;}
.btn-secondary:hover{border-color:var(--accent);background:var(--accent-soft);}
.input-field{background:var(--surface);border:1px solid var(--border);color:var(--text);transition:border-color .2s,box-shadow .2s;}
.input-field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(168,85,247,.15);}
.card{background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(10px);}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .5s ease forwards;}
.scale-in{animation:fadeIn .4s ease forwards;}
#splash{position:fixed;inset:0;z-index:999;background:radial-gradient(circle at 50% 40%,#241B3F,#0F0A1A);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s ease,visibility .4s;}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
.splash-logo{font-size:clamp(48px,10vw,96px);font-weight:800;letter-spacing:.05em;animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.85}}
.splash-sub{margin-top:16px;font-size:18px;color:#C4B5FD;letter-spacing:.3em;text-transform:uppercase;}
#drawer{position:fixed;top:0;left:0;height:100%;width:280px;background:#150E26;z-index:60;transform:translateX(-100%);transition:transform .3s ease;box-shadow:4px 0 30px rgba(0,0,0,.5);padding:24px 0;}
#drawer.open{transform:translateX(0);}
#drawerOverlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55;display:none;backdrop-filter:blur(4px);}
#drawerOverlay.show{display:block;}
.drawer-item{padding:14px 28px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;border-left:3px solid transparent;}
.drawer-item:hover{background:var(--accent-soft);border-left-color:var(--accent);color:#D8B4FE;}
.row-scroll{display:flex;gap:14px;overflow-x:auto;padding:8px 2px 16px;scroll-behavior:smooth;}
.vcard{flex:0 0 auto;width:200px;border-radius:12px;overflow:hidden;background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:all .25s;position:relative;}
.vcard:hover{transform:scale(1.05);box-shadow:0 10px 30px rgba(168,85,247,.3);}
.vcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;}
.lock-overlay{position:absolute;inset:0;background:rgba(15,10,26,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:10;backdrop-filter:blur(2px);}
.lock-icon{font-size:32px;margin-bottom:4px;}
.lock-text{font-size:12px;font-weight:600;color:#C4B5FD;}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:70;display:none;overflow-y:auto;backdrop-filter:blur(8px);}
.modal-backdrop.show{display:block;animation:fadeIn .3s ease forwards;}
.modal-content{transform:scale(.9);opacity:0;transition:all .3s ease;}
.modal-backdrop.show .modal-content{transform:scale(1);opacity:1;}
.alert{border-radius:10px;padding:12px 16px;margin-bottom:16px;font-weight:500;}
.alert-error{background:rgba(239,68,68,.1);border:1px solid var(--error);color:#FCA5A5;}
.alert-success{background:rgba(34,197,94,.1);border:1px solid var(--success);color:#86EFAC;}
.hidden{display:none !important;}
::-webkit-scrollbar{height:6px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px;}
.rank-tab{padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);color:var(--muted);transition:all .2s;}
.rank-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;}
.rank-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px;transition:background .2s;}

.rank-num{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;}
.score-bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;flex:1;overflow:hidden;}
.score-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;}
</style>

function irAPagina(nombre){
  toggleDrawer();
  const c = document.getElementById('contenido');
  c.innerHTML = '<div class="text-center py-20"><div class="grad-text text-3xl">Cargando...</div></div>';
  fetch(nombre + '.html')
    .then(r => { if(!r.ok) throw new Error('no'); return r.text(); })
    .then(html => { c.innerHTML = html; window.scrollTo(0,0); aplicarBloqueos(); })
    .catch(() => { c.innerHTML = '<div class="text-center py-20"><h2 class="text-2xl mb-4" style="color:#F87171;">Página no encontrada</h2><button onclick="irAPagina(\'inicio\')" class="btn-primary px-5 py-2 rounded-lg">Volver al Inicio</button></div>'; });
}

// ===== AUTH =====
function showAuthAlert(msg){
  document.getElementById('authAlert').innerHTML = '<div class="alert alert-error">' + msg + '</div>';
  setTimeout(function(){ document.getElementById('authAlert').innerHTML = ''; }, 5000);
}
function openAuthModal(){ document.getElementById('authModal').classList.add('show'); document.body.style.overflow='hidden'; }
function closeAuthModal(){ document.getElementById('authModal').classList.remove('show'); document.body.style.overflow='auto'; }
function switchAuthTab(tab){
  const lf = document.getElementById('loginForm'), rf = document.getElementById('registerForm');
  const tl = document.getElementById('tabLogin'), tr = document.getElementById('tabRegister');
  if(tab==='login'){
    lf.classList.remove('hidden'); rf.classList.add('hidden');
    tl.style.background='var(--accent)'; tl.style.color='#fff';
    tr.style.background='transparent'; tr.style.color='var(--muted)';
  } else {
    lf.classList.add('hidden'); rf.classList.remove('hidden');
    tr.style.background='var(--accent)'; tr.style.color='#fff';
    tl.style.background='transparent'; tl.style.color='var(--muted)';
  }
}
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value)
    .then(function(){ closeAuthModal(); actualizarUI(); })
    .catch(function(err){
      var m='Error al iniciar sesión';
      if(err.code==='auth/user-not-found') m='No existe una cuenta con este correo';
      else if(err.code==='auth/wrong-password') m='Contraseña incorrecta';
      else if(err.code==='auth/invalid-email') m='Correo inválido';
      showAuthAlert(m);
    });
});
document.getElementById('registerForm').addEventListener('submit', function(e){
  e.preventDefault();
  var name = document.getElementById('regName').value.trim();
  var email = document.getElementById('regEmail').value;
  var pass = document.getElementById('regPass').value;
  var pass2 = document.getElementById('regPass2').value;
  if(pass!==pass2) return showAuthAlert('Las contraseñas no coinciden');
  if(pass.length<6) return showAuthAlert('La contraseña debe tener al menos 6 caracteres');
  auth.createUserWithEmailAndPassword(email, pass)
    .then(function(uc){
      return uc.user.updateProfile({displayName:name}).then(function(){
        return db.collection('usuarios').doc(uc.user.uid).set({nombre:name, correo:email, fechaRegistro:new Date()});
      });
    })
    .then(function(){ closeAuthModal(); actualizarUI(); })
    .catch(function(err){
      var m='Error al crear cuenta';
      if(err.code==='auth/email-already-in-use') m='Este correo ya está registrado';
      else if(err.code==='auth/invalid-email') m='Correo inválido';
      showAuthAlert(m);
    });
});
function signInWithGoogle(){
  auth.signInWithPopup(provider).then(function(result){
    var u = result.user;
    return db.collection('usuarios').doc(u.uid).get().then(function(d){
      if(!d.exists) return db.collection('usuarios').doc(u.uid).set({nombre:u.displayName, correo:u.email, fechaRegistro:new Date()});
    });
  }).then(function(){ closeAuthModal(); actualizarUI(); })
    .catch(function(err){ if(err.code!=='auth/cancelled-popup-request') showAuthAlert('Error al iniciar con Google'); });
}
function logout(){ auth.signOut(); toggleDrawer(); }
function toggleDrawer(){ document.getElementById('drawer').classList.toggle('open'); document.getElementById('drawerOverlay').classList.toggle('show'); }

  {name:"Llamada🗣📱 #gacha",author:"Jazmín_Studios",views:"180K",score:44}
];
var RANK_COLORS = ['#FBBF24','#C084FC','#F472B6'];
var currentRankData = RANK_TUBERS;
function renderRankList(data){
  var el = document.getElementById('rankList');
  if(!el) return;
  el.innerHTML = data.map(function(r,i){
    var bg = i<3 ? RANK_COLORS[i] : '#241B3F';
    var tc = i<3 ? '#0F0A1A' : '#F3EFFF';
    return '<div class="rank-row scale-in" style="animation-delay:'+(i*40)+'ms;">'+
      '<div class="rank-num" style="background:'+bg+';color:'+tc+';">'+(i+1)+'</div>'+
      '<div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+r.name+'</div>'+
      '<div style="font-size:11px;color:#A89CC8;">'+(r.author?r.author+' · ':'')+(r.subs?r.subs+' suscriptores · ':'')+(r.views?r.views+' vistas':'')+'</div></div>'+
      '<div class="score-bar" style="max-width:140px;"><div class="score-fill" style="width:'+r.score+'%;"></div></div>'+
      '<div style="font-weight:800;font-size:18px;min-width:45px;text-align:right;" class="grad-text">'+r.score+'</div></div>';
  }).join('');
}
window.cambiarRankTab = function(el){
  document.querySelectorAll('#rankTabs .rank-tab').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
  currentRankData = el.dataset.tab==='videos' ? RANK_VIDEOS : RANK_TUBERS;
  renderRankList(currentRankData);
};

// ===== BLOQUEOS =====
function aplicarBloqueos(){
  document.querySelectorAll('[data-video]').forEach(function(el){
    el.onclick = function(){ verVideo(el.getAttribute('data-video'), el.getAttribute('data-titulo')||'Video'); };
  });
  // Ranking: mostrar/ocultar según sesión
  var locked = document.getElementById('rankLocked');
  var unlocked = document.getElementById('rankUnlocked');
  if(locked && unlocked){
    if(currentUser){
      locked.classList.add('hidden');
      unlocked.classList.remove('hidden');
      renderRankList(currentRankData);
    } else {
      locked.classList.remove('hidden');
      unlocked.classList.add('hidden');
    }
  }
}

function actualizarUI(){
  var auth = !!currentUser;
  document.getElementById('loginHeaderBtn').classList.toggle('hidden', auth);
  var av = document.getElementById('userAvatar');
  av.classList.toggle('hidden', !auth);
  av.style.display = auth ? 'flex' : 'none';
  document.getElementById('userNameDisplay').classList.toggle('hidden', !auth);
  document.getElementById('logoutBtn').classList.toggle('hidden', !auth);
  aplicarBloqueos();
}

// ===== INICIO: splash se cierra SIEMPRE =====
auth.onAuthStateChanged(function(user){
  document.getElementById('splash').classList.add('hide');
  currentUser = user;
  if(user){
    var dn = user.displayName || (user.email ? user.email.split('@')[0] : 'Usuario');
    document.getElementById('userNameDisplay').textContent = dn;
    document.getElementById('userEmailDisplay').textContent = user.email || '';
    document.getElementById('userAvatar').textContent = dn.charAt(0).toUpperCase();
  }
  actualizarUI();
  irAPagina('inicio');
});

// Cerrar modales con Escape
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeAuthModal(); cerrarVideo(); }
});
</script>
